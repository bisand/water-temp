; Low-power LoRa (SX1262) build for the Wemos D1 mini water-temp node.
; To use: copy this env into the project platformio.ini, and move
; firmware/water_temp_lora.cpp into src/ (replacing the old WiFi main.cpp).
[env:water_temp_lora]
platform = espressif8266
board = esp12e          ; bare ESP-12E/F module (4MB). d1_mini also works.
framework = arduino
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib@^6.6.0
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
